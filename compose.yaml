services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    command: sh -c "pnpm install --frozen-lockfile --ignore-scripts && CI=true pnpm rebuild && pnpm dev --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
