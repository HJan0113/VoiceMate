pre-commit:
  commands:
    backend-format:
      root: "backend/"
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    backend-lint:
      root: "backend/"
      glob: "*.go"
      run: go vet ./...

    frontend-format:
      root: "frontend/"
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm format {files}
      stage_fixed: true

    frontend-lint:
      root: "frontend/"
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm lint
